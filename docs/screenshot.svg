<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">FinSight Agent dashboard preview</title>
  <desc id="desc">A dashboard showing risk score, abnormal return, event study metrics, and an indexed asset versus benchmark chart.</desc>
  <defs>
    <linearGradient id="sidebarShade" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#17211f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#132522" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#eef4f3"/>
  <rect width="270" height="675" fill="url(#sidebarShade)"/>
  <rect x="32" y="35" width="44" height="44" rx="8" fill="#a7f3d0"/>
  <text x="54" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0b2c29">F</text>
  <text x="92" y="49" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#bcefe8">FINANCIAL ENGINEERING</text>
  <text x="92" y="66" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#bcefe8">AGENT</text>
  <text x="92" y="94" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="850" fill="#fff">FinSight Agent</text>
  <g fill="none" stroke="#ffffff" stroke-opacity=".11">
    <rect x="24" y="132" width="222" height="42" rx="8"/>
    <rect x="24" y="185" width="222" height="42" rx="8"/>
    <rect x="24" y="238" width="222" height="42" rx="8"/>
    <rect x="24" y="291" width="222" height="42" rx="8"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#eafffb">
    <text x="40" y="159">Workspace</text>
    <text x="40" y="212">Diagnostics</text>
    <text x="40" y="265">Agent Trace</text>
    <text x="40" y="318">Risk Memo</text>
  </g>
  <rect x="24" y="370" width="222" height="145" rx="8" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="40" y="400" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#bcefe8">PROJECT NOTE</text>
  <text x="40" y="430" font-family="Inter, Arial, sans-serif" font-size="17" fill="#eafffb">Analyze how a market</text>
  <text x="40" y="456" font-family="Inter, Arial, sans-serif" font-size="17" fill="#eafffb">event changes risk,</text>
  <text x="40" y="482" font-family="Inter, Arial, sans-serif" font-size="17" fill="#eafffb">abnormal return, and</text>
  <text x="40" y="508" font-family="Inter, Arial, sans-serif" font-size="17" fill="#eafffb">research priorities.</text>
  <rect x="300" y="30" width="860" height="106" rx="8" fill="#fff" filter="url(#shadow)" stroke="#d8dfdd"/>
  <text x="325" y="63" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="850" fill="#68736f">AI-ASSISTED MARKET EVENT ANALYSIS</text>
  <text x="325" y="100" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" fill="#18201f">From Unstructured Evidence To Risk Insight</text>
  <rect x="916" y="53" width="126" height="42" rx="8" fill="#fff" stroke="#d8dfdd"/>
  <text x="979" y="80" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#18201f">Load Scenario</text>
  <rect x="1054" y="53" width="82" height="42" rx="8" fill="#0f766e"/>
  <text x="1095" y="80" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Analyze</text>
  <rect x="300" y="162" width="860" height="470" rx="8" fill="#fff" filter="url(#shadow)" stroke="#d8dfdd"/>
  <text x="325" y="195" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="850" fill="#68736f">LIVE OUTPUT</text>
  <text x="325" y="222" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#18201f">Decision Snapshot</text>
  <rect x="1042" y="182" width="94" height="30" rx="15" fill="#eef3f1" stroke="#d8dfdd"/>
  <text x="1089" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="850" fill="#29423e">Market Model</text>
