    <rect x="325" y="245" width="192" height="70" rx="8" fill="#fbfdfc" stroke="#d8dfdd"/>
    <text x="340" y="270" font-size="13" font-weight="800" fill="#68736f">Risk score</text>
    <text x="340" y="300" font-size="22" font-weight="900" fill="#18201f">71/100</text>
    <rect x="533" y="245" width="192" height="70" rx="8" fill="#fbfdfc" stroke="#d8dfdd"/>
    <text x="548" y="270" font-size="13" font-weight="800" fill="#68736f">Risk band</text>
    <text x="548" y="300" font-size="22" font-weight="900" fill="#18201f">High</text>
    <rect x="741" y="245" width="192" height="70" rx="8" fill="#fbfdfc" stroke="#d8dfdd"/>
    <text x="756" y="270" font-size="13" font-weight="800" fill="#68736f">CAR</text>
    <text x="756" y="300" font-size="22" font-weight="900" fill="#18201f">-12.76%</text>
    <rect x="949" y="245" width="187" height="70" rx="8" fill="#fbfdfc" stroke="#d8dfdd"/>
    <text x="964" y="270" font-size="13" font-weight="800" fill="#68736f">Day-0 abnormal</text>
    <text x="964" y="300" font-size="22" font-weight="900" fill="#18201f">-6.24%</text>
    <rect x="325" y="330" width="192" height="70" rx="8" fill="#fbfdfc" stroke="#d8dfdd"/>
    <text x="340" y="355" font-size="13" font-weight="800" fill="#68736f">Market beta</text>
    <text x="340" y="385" font-size="22" font-weight="900" fill="#18201f">-0.49</text>
    <rect x="533" y="330" width="192" height="70" rx="8" fill="#fbfdfc" stroke="#d8dfdd"/>
    <text x="548" y="355" font-size="13" font-weight="800" fill="#68736f">T-stat / p-value</text>
    <text x="548" y="385" font-size="22" font-weight="900" fill="#18201f">-3.11</text>
    <rect x="741" y="330" width="192" height="70" rx="8" fill="#fbfdfc" stroke="#d8dfdd"/>
    <text x="756" y="355" font-size="13" font-weight="800" fill="#68736f">Daily 95% VaR</text>
    <text x="756" y="385" font-size="22" font-weight="900" fill="#18201f">-2.12%</text>
    <rect x="949" y="330" width="187" height="70" rx="8" fill="#fbfdfc" stroke="#d8dfdd"/>
    <text x="964" y="355" font-size="13" font-weight="800" fill="#68736f">Max drawdown</text>
    <text x="964" y="385" font-size="22" font-weight="900" fill="#18201f">-11.99%</text>
  </g>
  <rect x="325" y="424" width="811" height="180" rx="8" fill="#fbfdfc" stroke="#d8dfdd"/>
  <g stroke="#d8dfdd" stroke-width="1">
    <line x1="370" y1="460" x2="1100" y2="460"/>
    <line x1="370" y1="510" x2="1100" y2="510"/>
    <line x1="370" y1="560" x2="1100" y2="560"/>
  </g>
  <polyline points="370,566 430,545 490,515 550,480 610,445 670,420 730,452 790,468 850,492 910,526 970,548 1030,538 1100,520" fill="none" stroke="#0f766e" stroke-width="4"/>
  <polyline points="370,565 430,560 490,554 550,548 610,543 670,538 730,532 790,526 850,520 910,516 970,514 1030,515 1100,518" fill="none" stroke="#87928f" stroke-width="3"/>
  <line x1="790" y1="434" x2="790" y2="592" stroke="#d85c4a" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="790" cy="468" r="6" fill="#d85c4a"/>
  <text x="342" y="452" font-family="Inter, Arial, sans-serif" font-size="12" fill="#68736f">118.8 indexed</text>
  <rect x="982" y="443" width="20" height="3" fill="#0f766e"/>
  <text x="1010" y="449" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0f766e">Asset</text>
  <rect x="1065" y="443" width="20" height="3" fill="#87928f"/>
  <text x="1092" y="449" font-family="Inter, Arial, sans-serif" font-size="12" fill="#68736f">Benchmark</text>
</svg>
